<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>L-GPT Shopping Copilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M6 9h13a6 6 0 0 1 0 12h-6l-5 4v-4H6z" fill="none"
                stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" />
          <circle cx="22.5" cy="22.5" r="5" fill="none" stroke="currentColor" stroke-width="2.2" />
          <path d="m26.2 26.2 3.3 3.3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </svg>
        <div class="wordmark">
          <strong>L-GPT</strong><span>Shopping Copilot</span>
        </div>
      </div>
      <div class="right">
        <span id="layers" class="layers" title="active layers"></span>
        <button id="reset" class="ghost" type="button">New chat</button>
      </div>
    </header>

    <main id="thread" class="thread">
      <div class="intro">
        <h1>What are you shopping for?</h1>
        <p>
          Ask in your own words. The copilot searches a frozen catalogue of
          <strong>50,000</strong> clothing, shoes and jewellery products, and asks a
          follow-up question each turn to narrow it down.
        </p>
        <div class="chips">
          <button type="button">something warm for winter walks</button>
          <button type="button">a leather watch with a stainless steel band</button>
          <button type="button">soft cotton t-shirt, nothing synthetic</button>
        </div>
      </div>
    </main>

    <form id="composer" class="composer" autocomplete="off">
      <input id="input" type="text" placeholder="Tell me what you're looking for…" />
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor"
                stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </form>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
